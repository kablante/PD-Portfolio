name: Deploy to GitHub Pages

# Pages cannot build a Vite app on its own — served raw, index.html only
# points at /src/main.tsx and renders nothing. This builds the site and
# publishes dist/ instead.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The router is client-side, so a direct hit on /projects/<slug> never
      # reaches index.html. Pages serves 404.html for unknown paths; making it
      # a copy of index.html lets the app boot and read the URL itself.
      - run: cp dist/index.html dist/404.html
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
